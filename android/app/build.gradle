plugins { id 'com.android.application' }

// Uygulama sayfası (public/) derleme sırasında APK'nın içine kopyalanır.
def webDir = layout.buildDirectory.dir("generated/webassets")
def copyWeb = tasks.register("copyWeb", Sync) {
    from(rootProject.file("../public")) { into "public" }
    into webDir
}

android {
    namespace 'com.sviapp.turnuvafiksturu'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sviapp.turnuvafiksturu'
        minSdk 24
        targetSdk 36
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    // test.keystore yalnızca telefona elle kurulan test APK'ları içindir (Play Store için ayrı anahtar gerekir)
    signingConfigs {
        test {
            storeFile rootProject.file("test.keystore")
            storePassword "turnuva-test"
            keyAlias "turnuva"
            keyPassword "turnuva-test"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Play Store paketi (AAB) imzasız derlenir, yükleme anahtarıyla sonradan imzalanır
            signingConfig project.hasProperty('imzasiz') ? null : signingConfigs.test
        }
    }
    sourceSets { main { assets.srcDirs += webDir } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'com.google.guava:listenablefuture:1.0'   // WorkManager'ın Java'dan derlenmesi için
}
tasks.named("preBuild") { dependsOn copyWeb }

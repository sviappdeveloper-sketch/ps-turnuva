# XcodeGen proje tanımı: `xcodegen generate` → TurnuvaFiksturu.xcodeproj
# (Xcode projesi depoya konmaz; Codemagic ve GitHub Actions derlemeden önce üretir.)
name: TurnuvaFiksturu
options:
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: tr
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0
targets:
  TurnuvaFiksturu:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
      - path: Resources
      - path: ../public
        type: folder
        buildPhase: resources
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Fikstür
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBG
        GADApplicationIdentifier: $(TF_ADMOB_APP_ID)
        TFAdInterstitial: $(TF_AD_INTERSTITIAL)
        NSUserTrackingUsageDescription: Reklamları sana daha uygun hale getirmek için kullanılır. İzin vermesen de uygulamanın tamamını kullanabilirsin.

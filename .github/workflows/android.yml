name: Android APK
# Telefona elle kurulabilen APK üretir ve "apk" dalına koyar (turnuva-fiksturu.apk).
on:
  push:
    branches: [main, android]
    paths: ['public/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: APK derle
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease
          gradle --no-daemon bundleRelease -Pimzasiz
      - uses: actions/upload-artifact@v4
        with: { name: turnuva-fiksturu-apk, path: android/app/build/outputs/ }
      - name: APK'yı "apk" dalına koy
        run: |
          mkdir out && cp android/app/build/outputs/apk/release/app-release.apk out/turnuva-fiksturu.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/turnuva-fiksturu-imzasiz.aab
          cd out
          echo "Derleme ${GITHUB_RUN_NUMBER} · ${GITHUB_SHA}" > SURUM.txt
          git init -q -b apk && git add . 
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "APK derleme ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk
